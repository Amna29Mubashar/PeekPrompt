# Backup way to generate the Xcode project, in case PeekPrompt.xcodeproj ever breaks.
#   brew install xcodegen
#   xcodegen generate
name: PeekPrompt
options:
  deploymentTarget:
    macOS: "14.0"
targets:
  PeekPrompt:
    type: application
    platform: macOS
    sources: [PeekPrompt]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amnamubashar.PeekPrompt
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 5.0
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: PeekPrompt.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: PeekPrompt
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Word Tracking listens to the words you say so the script can follow along. When your Mac supports it, recognition happens on-device."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "The phone remote lets you control PeekPrompt from your phone's browser on the same Wi-Fi."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "PeekPrompt uses the microphone to scroll while you speak, follow your words and make the border glow. Nothing is recorded or saved."
